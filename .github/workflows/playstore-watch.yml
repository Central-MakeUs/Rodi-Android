name: Play Store Update Watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playstore-watch
  cancel-in-progress: false

jobs:
  check-update:
    name: Check Play Store Update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Test release watch
        run: python .github/playstore-watch/test_check_playstore_update.py

      - name: Check Play production release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python .github/playstore-watch/check_playstore_update.py

      - name: Commit updated state
        run: |
          if [ -z "$(git status --porcelain -- .github/playstore-watch/playstore-state.json)" ]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/playstore-watch/playstore-state.json
          git commit -m "chore: update playstore watch state [skip ci]"
          git push
