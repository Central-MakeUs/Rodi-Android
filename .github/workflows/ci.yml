name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Convention Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: command -v rg || sudo apt-get install -y ripgrep

      - name: Check conventions
        run: .github/scripts/check-conventions.sh

  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: Write local.properties
        run: |
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> local.properties
          echo "KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}" >> local.properties

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit Test
        run: ./gradlew test --stacktrace

      - name: Verify Screenshots
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Upload Screenshot Diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**
          retention-days: 7

      # Roborazzi 테스트는 verify 모드일 때만 컴포저블을 렌더링한다. verifyRoborazziDebug를 함께 줘야
      # 직전 스텝의 테스트 결과를 재사용하고, 커버리지도 렌더링이 반영된 값으로 나온다.
      - name: Coverage Report
        run: ./gradlew verifyRoborazziDebug koverXmlReport koverHtmlReport --stacktrace

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/**
          retention-days: 7

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

      - name: Lint
        run: ./gradlew lint

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
